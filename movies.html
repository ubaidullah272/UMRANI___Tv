
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMRANI TV — Movies</title>
<link rel="stylesheet" href="style.css">

<style>
.movie-info{
 display:flex;
 justify-content:space-between;
 align-items:center;
 color:#aaa;
 font-size:13px;
 margin:10px 0 18px;
}
.items{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(155px,1fr));
 gap:15px;
}
.item{
 background:#111;
 border:1px solid #333;
 border-radius:13px;
 padding:11px;
 text-align:center;
 overflow:hidden;
}
.item img{
 width:100%;
 height:205px;
 object-fit:cover;
 border-radius:8px;
 background:#222;
}
.item h3{
 font-size:15px;
 min-height:38px;
 color:white;
}
.item .btn{
 width:100%;
}
.player{
 display:none;
 margin:25px auto;
 background:#111;
 border:1px solid #444;
 border-radius:12px;
 padding:12px;
}
.player.active{
 display:block;
}
.frame{
 position:relative;
 width:100%;
 aspect-ratio:16/9;
 background:#000;
}
.frame iframe{
 width:100%;
 height:100%;
 border:0;
}
.watermark{
 position:absolute;
 right:12px;
 bottom:10px;
 color:#fff;
 text-shadow:0 1px 5px #000;
 font-weight:bold;
 pointer-events:none;
}
.controls{
 display:flex;
 align-items:center;
 gap:12px;
 flex-wrap:wrap;
 margin-top:12px;
}
.controls label{
 font-size:13px;
 color:#ccc;
}
.controls input{
 width:95px;
}
.close{
 margin-left:auto;
}
@media(max-width:500px){
 .items{
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
 }
 .item img{
  height:160px;
 }
 .item h3{
  font-size:13px;
 }
}
</style>
</head>

<body>

<header class="topbar">
 <a class="brand" href="index.html">UMRANI <span>TV</span></a>
</header>

<main class="page">

 <a class="back" href="index.html">← Home</a>

 <h1 class="title">🍿🎥 Movies</h1>

 <div class="movie-info">
  <span>Enjoy Your Movies ❤️</span>
  <span id="movieCount">0 Movies</span>
 </div>

 <div id="movieList" class="items"></div>

 <section id="player" class="player">

  <h3 id="playerTitle">Now Playing</h3>

  <div id="frame" class="frame"></div>

  <div class="controls">

   <label>
    Brightness
    <input type="range" min="50" max="150" value="100"
    oninput="brightness(this.value)">
   </label>

   <label>
    Volume
    <input type="range" min="0" max="100" value="80"
    oninput="volume(this.value)">
    <span id="volumeValue">80%</span>
   </label>

   <button class="btn" onclick="fullscreen()">
    Fullscreen
   </button>

   <button class="btn close" onclick="closePlayer()">
    Close ✕
   </button>

  </div>
 </section>

</main>

<script src="movies.js"></script>
<script src="player.js"></script>

<script>

const list = document.getElementById("movieList");

const movieCount = document.getElementById("movieCount");

const allMovies = Array.isArray(window.movies)
 ? window.movies
 : [];

movieCount.textContent = allMovies.length + " Movies";

if(allMovies.length === 0){

 list.innerHTML =
 '<div class="empty">🍿 Movies Coming Soon!</div>';

}

allMovies.forEach((movie,index)=>{

 const card = document.createElement("div");
 card.className = "item";

 const img = document.createElement("img");

 img.src = movie.image || "";

 img.alt = movie.name || "Movie";

 img.loading = "lazy";

 img.onerror = function(){
  this.src =
  "https://placehold.co/400x250/171717/ffffff?text=UMRANI+TV";
 };

 const title = document.createElement("h3");

 title.textContent = movie.name || "Movie " + (index+1);

 const button = document.createElement("button");

 button.className = "btn";

 button.textContent = "▶ Watch Movie";

 button.onclick = function(){

  if(typeof playVideo === "function" && movie.url){

   playVideo(movie.url,movie.name);

  }else{

   alert("Movie link is not available!");

  }

 };

 card.appendChild(img);
 card.appendChild(title);
 card.appendChild(button);

 list.appendChild(card);

});

</script>

</body>
</html>
