
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UMRANI TV - Movies</title>

<link rel="stylesheet" href="style.css">

<style>
.movie-heading{
 text-align:center;
 margin:20px 0;
}

.movie-heading h1{
 font-size:28px;
}

.movie-heading p{
 color:#aaa;
}

.movie-count{
 color:#aaa;
 text-align:center;
 margin-bottom:18px;
}

.items{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
 gap:15px;
}

.item{
 background:#151515;
 border:1px solid #333;
 border-radius:12px;
 padding:10px;
 text-align:center;
 overflow:hidden;
}

.item img{
 width:100%;
 height:190px;
 object-fit:cover;
 border-radius:8px;
 background:#222;
}

.item h3{
 color:white;
 font-size:15px;
 min-height:38px;
 margin:10px 0;
}

.item .btn{
 width:100%;
 cursor:pointer;
}

.player{
 display:none;
 margin-top:25px;
 padding:12px;
 background:#111;
 border:1px solid #444;
 border-radius:12px;
}

.player.active{
 display:block;
}

.frame{
 width:100%;
 aspect-ratio:16/9;
 background:#000;
 position:relative;
}

.frame iframe{
 width:100%;
 height:100%;
 border:0;
}

.controls{
 display:flex;
 flex-wrap:wrap;
 align-items:center;
 gap:12px;
 margin-top:12px;
}

.controls label{
 color:#ddd;
 font-size:13px;
}

.controls input{
 width:90px;
}

.close{
 margin-left:auto;
}

@media(max-width:500px){
 .items{
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
 }

 .item img{
  height:155px;
 }

 .item h3{
  font-size:13px;
 }
}
</style>
</head>

<body>

<header class="topbar">
 <a class="brand" href="index.html">
  UMRANI <span>TV</span>
 </a>
</header>

<main class="page">

 <a class="back" href="index.html">← Home</a>

 <div class="movie-heading">
  <h1 class="title">🍿🎥 Movies</h1>
  <p>Watch Your Favourite Movies ❤️</p>
 </div>

 <div id="movieCount" class="movie-count">
  Loading Movies...
 </div>

 <div id="movieList" class="items"></div>

 <section id="player" class="player">

  <h3 id="playerTitle">Now Playing</h3>

  <div id="frame" class="frame"></div>

  <div class="controls">

   <label>
    Brightness
    <input type="range"
     min="50"
     max="150"
     value="100"
     oninput="brightness(this.value)">
   </label>

   <label>
    Volume
    <input type="range"
     min="0"
     max="100"
     value="80"
     oninput="volume(this.value)">
    <span id="volumeValue">80%</span>
   </label>

   <button class="btn" onclick="fullscreen()">
    Fullscreen
   </button>

   <button class="btn close" onclick="closePlayer()">
    Close ✕
   </button>

  </div>

 </section>

</main>

<script src="movies.js"></script>
<script src="player.js"></script>

<script>

const list = document.getElementById("movieList");
const count = document.getElementById("movieCount");

const movies = Array.isArray(window.movies)
 ? window.movies
 : [];

count.textContent = movies.length + " Movies Available";

if(movies.length === 0){

 list.innerHTML =
 '<div class="empty">🍿 Movies Coming Soon!</div>';

}

movies.forEach((movie,index)=>{

 const card = document.createElement("div");
 card.className = "item";

 const img = document.createElement("img");

 img.src = movie.image || "";
 img.alt = movie.name || "Movie";
 img.loading = "lazy";

 img.onerror = function(){
  this.src =
  "https://placehold.co/400x250/171717/ffffff?text=UMRANI+TV";
 };

 const heading = document.createElement("h3");

 heading.textContent =
 movie.name || "Movie " + (index+1);

 const button = document.createElement("button");

 button.className = "btn";
 button.textContent = "▶ Watch Movie";

 button.onclick = function(){

  if(typeof playVideo === "function" && movie.url){

   playVideo(movie.url,movie.name);

  }else{

   alert("Movie player or video link is unavailable!");

  }

 };

 card.appendChild(img);
 card.appendChild(heading);
 card.appendChild(button);

 list.appendChild(card);

});

</script>

</body>
</html>
